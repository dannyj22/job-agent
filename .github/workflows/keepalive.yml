name: Keepalive

# GitHub disables scheduled workflows after ~60 days without repository
# activity. A monthly no-op commit keeps the job-agent schedule alive.

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Touch timestamp
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive.txt
      - name: Commit
        run: |
          git config user.name "job-agent"
          git config user.email "actions@users.noreply.github.com"
          git add .github/keepalive.txt
          git commit -m "chore: keepalive" || echo "nothing to commit"
          git push
